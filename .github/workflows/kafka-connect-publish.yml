name: Kafka Connect Bigtable Sink Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'kafka-connect-bigtable-sink-v')
    uses: ./.github/workflows/kafka-connect-ci-reusable.yml

  upload-release-asset:
    name: Publish Jar and Maven Artifacts via OSS Exit Gate
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="cloud-bigtable-ecosystem--mavencentral" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="\'"oss-exit-gate-prod"\'" \
                  --location="\'"us"\'" \
                  --repository="\'cloud-bigtable-ecosystem--mavencentral\'" \
                  --quiet
          '

      - name: Build Fat Jar and stage to OSS Exit Gate Maven Artifact Registry
        working-directory: kafka-connect-bigtable-sink
        run: |
          mvn -B -ntp clean deploy -pl sink -am -DskipTests \
            -DaltDeploymentRepository="oss-exit-gate::default::artifactregistry://us-maven.pkg.dev/oss-exit-gate-prod/cloud-bigtable-ecosystem--mavencentral"
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/cloud-bigtable-ecosystem/mavencentral/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Upload Artifact to Release
        if: github.event_name == 'release'
        working-directory: kafka-connect-bigtable-sink
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${RELEASE_TAG}" ./sink/target/kafka-connect-bigtable-sink.jar --clobber
