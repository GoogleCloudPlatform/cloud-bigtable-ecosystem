name: Kafka Connect Bigtable Sink Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'kafka-connect-bigtable-sink-v')
    uses: ./.github/workflows/kafka-connect-ci-reusable.yml

  upload-release-asset:
    name: Publish Jar and Maven Artifacts via OSS Exit Gate
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up previous staging attempt for this version (if any)
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("kafka-connect-bigtable-sink/pom.xml").getroot(); ns={"m": r.tag.split("}")[0][1:]} if "}" in r.tag else {}; print((r.findtext("m:version", namespaces=ns) if ns else r.findtext("version")).strip())')
          for pkg_name in \
            "com.google.cloud.kafka.connect.bigtable:sink" \
            "com.google.cloud.kafka.connect.bigtable:sink-parent"; do
            if gcloud artifacts versions describe "${VERSION}" \
              --package="${pkg_name}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="cloud-bigtable-ecosystem--mavencentral" >/dev/null 2>&1; then
              gcloud artifacts versions delete "${VERSION}" \
                --package="${pkg_name}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="cloud-bigtable-ecosystem--mavencentral" \
                --quiet
            fi
          done

      - name: Build Fat Jar and stage to OSS Exit Gate Maven Artifact Registry
        working-directory: kafka-connect-bigtable-sink
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mvn -B -ntp clean deploy -pl sink -am -DskipTests \
            -DaltDeploymentRepository="oss-exit-gate::default::artifactregistry://us-maven.pkg.dev/oss-exit-gate-prod/cloud-bigtable-ecosystem--mavencentral"
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/cloud-bigtable-ecosystem/mavencentral/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

      - name: Upload Artifact to Release
        if: github.event_name == 'release'
        working-directory: kafka-connect-bigtable-sink
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${RELEASE_TAG}" ./sink/target/kafka-connect-bigtable-sink.jar --clobber
